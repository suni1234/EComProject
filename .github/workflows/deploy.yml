name: FGW Service CI/CD

on:
  push:
    branches:
      - main

jobs:

  # ── Stage 1: Build + Test ──────────────────
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build
        run: mvn clean package -DskipTests
      - name: Test
        run: mvn test