server:
  port: 8082
  
  
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}  


  management:
  health:
    redis:
      enabled: false

  application:
    name: fgw-service
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      ssl:
        enabled: ${SPRING_REDIS_SSL:false}
aws:
  region: ${AWS_REGION:us-east-1}
  account-id: ${AWS_ACCOUNT_ID}
  cognito:
    user-pool-id: ${COGNITO_USER_POOL_ID}
    client-id: ${COGNITO_CLIENT_ID}
    issuer-uri: ${COGNITO_ISSUER_URI}
  secrets-manager:
    secret-name: ${SECRETS_MANAGER_SECRET_NAME:jwt-public-key}
    secret-arn: ${SECRETS_MANAGER_SECRET_ARN}
  kms:
    key-id: ${KMS_KEY_ID}
    key-arn: ${KMS_KEY_ARN}
  iam:
    role-admin: ${IAM_ROLE_ADMIN}
    role-editor: ${IAM_ROLE_EDITOR}
    role-viewer: ${IAM_ROLE_VIEWER}
    role-default: ${IAM_ROLE_DEFAULT}

auth-service:
  url: ${AUTH_SERVICE_URL}

logging:
  level:
    com.fgw: ${LOG_LEVEL_APP:INFO}
    software.amazon.awssdk: WARN

rate-limit:
  requests-per-minute: ${RATE_LIMIT_RPM:5}


management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    redis:
      enabled: false

  # ── Correct key for Spring Boot 3.2+ (replaces metrics.export.prometheus) ──
  prometheus:
    metrics:
      export:
        enabled: true
        step: 30s

  # ── Metric tags and percentiles (these keys are unchanged) ──
  metrics:
    tags:
      application: fgw-service
      environment: ${SPRING_PROFILES_ACTIVE:local}
      region: ${AWS_REGION:us-east-1}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99






        