server:
  port: 8082

spring:
  application:
    name: fgw-service
  data:
    redis:
      host: ${SPRING_REDIS_HOST}          # ← No default, must be set in ECS
      port: ${SPRING_REDIS_PORT:6379}

aws:
  region: ${AWS_REGION:us-east-1}
  account-id: ${AWS_ACCOUNT_ID}           # ← From ECS Task Definition env var
  cognito:
    user-pool-id: ${COGNITO_USER_POOL_ID}
    client-id: ${COGNITO_CLIENT_ID}
    issuer-uri: ${COGNITO_ISSUER_URI}
  secrets-manager:
    secret-name: ${SECRETS_MANAGER_SECRET_NAME:jwt-public-key}
    secret-arn: ${SECRETS_MANAGER_SECRET_ARN}
  kms:
    key-id: ${KMS_KEY_ID}
    key-arn: ${KMS_KEY_ARN}
  iam:
    role-admin:   ${IAM_ROLE_ADMIN}
    role-editor:  ${IAM_ROLE_EDITOR}
    role-viewer:  ${IAM_ROLE_VIEWER}
    role-default: ${IAM_ROLE_DEFAULT}

auth-service:
  url: ${AUTH_SERVICE_URL}                # ← ECS service discovery URL

logging:
  level:
    com.fgw: ${LOG_LEVEL_APP:INFO}        # ← DEBUG only in dev, INFO in prod
    software.amazon.awssdk: WARN

rate-limit:
  requests-per-minute: ${RATE_LIMIT_RPM:5}    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    