server:
  port: 8082

spring:
  application:
    name: fgw-service
  data:
    redis:
      host: ${SPRING_REDIS_HOST}
      port: ${SPRING_REDIS_PORT:6379}

aws:
  region: ${AWS_REGION:us-east-1}
  account-id: ${AWS_ACCOUNT_ID}
  cognito:
    user-pool-id: ${COGNITO_USER_POOL_ID}
    client-id: ${COGNITO_CLIENT_ID}
    issuer-uri: ${COGNITO_ISSUER_URI}
  secrets-manager:
    secret-name: ${SECRETS_MANAGER_SECRET_NAME:jwt-public-key}
    secret-arn: ${SECRETS_MANAGER_SECRET_ARN}
  kms:
    key-id: ${KMS_KEY_ID}
    key-arn: ${KMS_KEY_ARN}
  iam:
    role-admin: ${IAM_ROLE_ADMIN}
    role-editor: ${IAM_ROLE_EDITOR}
    role-viewer: ${IAM_ROLE_VIEWER}
    role-default: ${IAM_ROLE_DEFAULT}

auth-service:
  url: ${AUTH_SERVICE_URL}

logging:
  level:
    com.fgw: ${LOG_LEVEL_APP:INFO}
    software.amazon.awssdk: WARN

rate-limit:
  requests-per-minute: ${RATE_LIMIT_RPM:5}

# Actuator Health Check
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true